<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTH Secure Tool & VNPAY</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .responsive-table { display: block; width: 100%; overflow-x: auto; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800">UTH Secure Tool & VNPAY</h1>
            <p class="text-gray-600 mt-2">Công cụ hỗ trợ đăng ký môn học và thanh toán học phí</p>
        </header>

        <main class="space-y-8">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">1. Đăng nhập</h2>
                <div class="space-y-4">
                    <input id="student-id" type="text" placeholder="Mã sinh viên" class="w-full px-4 py-2 border rounded-md">
                    <input id="password" type="password" placeholder="Mật khẩu" class="w-full px-4 py-2 border rounded-md">
                    <button id="login-button" class="w-full bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700">Đăng nhập</button>
                    <textarea id="token-output" rows="3" class="w-full bg-gray-100 text-sm rounded-lg p-2" readonly placeholder="Token sẽ xuất hiện ở đây..."></textarea>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">2. Đăng ký môn học</h2>
                <div class="flex items-center space-x-4">
                    <input id="course-code" type="text" placeholder="Nhập mã môn học" class="w-full px-4 py-2 border rounded-md">
                    <button id="register-button" class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700">Đăng ký</button>
                    <button id="refresh-button" class="bg-gray-500 text-white px-6 py-2 rounded-md hover:bg-gray-600">Làm mới DS</button>
                </div>
                <div id="registered-container" class="overflow-auto max-h-96 responsive-table mt-4">
                    <p class="text-gray-500 text-center py-8">Chưa có dữ liệu. Đăng nhập và nhấn "Làm mới".</p>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">3. Thanh toán VNPAY</h2>
                <div class="flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4">
                    <input id="amount" type="number" placeholder="Nhập số tiền (VND)" class="w-full px-4 py-2 border rounded-md">
                    <button id="payment-button" class="w-full sm:w-auto bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700">Thanh toán</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">Nhật ký hoạt động</h2>
                <div id="log-output" class="w-full h-48 bg-gray-900 text-white text-sm font-mono rounded-lg p-3 overflow-y-auto"></div>
            </div>
        </main>
        <footer class="text-center text-sm text-gray-500 mt-8 py-4 border-t">
            <p>Last updated on September 17, 2025</p>
        </footer>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
