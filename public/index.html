<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTH Đăng Ký Học Phần Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
        .disabled-section { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div id="app-container" class="hidden p-4 md:p-8 max-w-7xl mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-lg mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Xin chào, <span id="student-name"></span>!</h1>
                    <p class="text-gray-600">MSSV: <span id="student-code"></span></p>
                    <p class="text-sm font-semibold">Tài khoản: <span id="user-role" class="px-2 py-1 rounded text-white"></span></p>
                </div>
                <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">Đăng Xuất</button>
            </div>
        </div>

        <div id="main-content" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div id="registration-section" class="bg-white p-6 rounded-xl shadow-lg">
                <div class="flex items-center space-x-4 mb-4">
                    <button id="fetch-data-btn" class="w-full bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Lấy Dữ Liệu</button>
                    <button id="buy-vip-btn" class="hidden w-full bg-yellow-500 text-white px-6 py-2 rounded-lg hover:bg-yellow-600 transition">✨ Mua VIP</button>
                </div>
                </div>

            <div id="registered-section" class="bg-white p-6 rounded-xl shadow-lg">
                 <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Các học phần đã đăng ký thành công</h2>
                 <div id="registered-list" class="space-y-3">
                     </div>
            </div>
        </div>
    </div>

    <div id="vip-modal" class="modal fixed inset-0 bg-black bg-opacity-60 items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all scale-95">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Nâng cấp tài khoản VIP</h2>
            <p class="text-center text-gray-500 mb-6">Mở khóa tất cả tính năng không giới hạn.</p>
            <div class="space-y-4">
                <button class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition duration-300 vip-package-btn" data-days="1" data-price="10000">
                    1 Ngày - 10,000 VNĐ
                </button>
                <button class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition duration-300 vip-package-btn" data-days="3" data-price="30000">
                    3 Ngày - 30,000 VNĐ
                </button>
                <button class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition duration-300 vip-package-btn" data-days="5" data-price="50000">
                    5 Ngày - 50,000 VNĐ
                </button>
            </div>
            <button id="close-modal-btn" class="mt-6 w-full bg-gray-300 text-gray-800 p-2 rounded-lg hover:bg-gray-400 transition duration-300">
                Đóng
            </button>
        </div>
    </div>
    
    <div id="payment-modal" class="modal fixed inset-0 bg-black bg-opacity-70 items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm text-center">
            <h2 class="text-xl font-bold mb-4">Quét mã QR để thanh toán</h2>
            <img id="qr-code-img" src="" alt="QR Code" class="mx-auto mb-4 border rounded-lg">
            <div class="text-left bg-gray-50 p-4 rounded-lg">
                <p><strong>Ngân hàng:</strong> <span id="payment-bank"></span></p>
                <p><strong>Số tài khoản:</strong> <span id="payment-account"></span></p>
                <p><strong>Chủ tài khoản:</strong> <span id="payment-name"></span></p>
                <p><strong>Số tiền:</strong> <span id="payment-amount" class="font-bold text-red-600"></span> VNĐ</p>
                <p><strong>Nội dung:</strong> <span id="payment-content" class="font-bold text-blue-600"></span></p>
            </div>
            <p id="payment-status-text" class="mt-4 text-gray-600">Trạng thái: Đang chờ thanh toán...</p>
             <button id="close-payment-modal-btn" class="mt-4 w-full bg-gray-300 p-2 rounded-lg">Đóng</button>
        </div>
    </div>


    <script src="app.js" defer></script>
</body>
</html>
